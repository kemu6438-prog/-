<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>街ドライブビュー - 建物データ確認</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #fff; font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; overflow: hidden; touch-action: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #panel { position: fixed; left: 8px; top: 8px; padding: 8px 10px; background: rgba(0,0,0,.62); border-radius: 8px; font-size: 13px; line-height: 1.55; width: min(430px, 92vw); max-height: 90vh; overflow: auto; }
      #fps { font-size: 26px; font-weight: bold; }
      button { font-size: 13px; margin: 3px 3px 0 0; padding: 5px 9px; border-radius: 6px; border: 0; background: #3b82f6; color: #fff; }
      button.on { background: #f59e0b; color: #000; }
      small { opacity: .85; }
      #log { font-size: 11px; line-height: 1.4; max-height: 130px; overflow: auto; white-space: pre-wrap; opacity: .9; margin-top: 4px; border-top: 1px solid #fff3; padding-top: 4px; }
      #fwd { position: fixed; right: 16px; bottom: 28px; width: 84px; height: 84px; border-radius: 50%; font-size: 15px; display: none; background: #10b981; }
      #hide { position: fixed; right: 8px; top: 8px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <div><span id="fps">--</span> コマ/秒 <small id="ms"></small></div>
      <div><small>描画: <span id="backend">調べ中</span> / <span id="res"></span></small></div>
      <div><small>GPU: <span id="gpu">調べ中</span></small></div>
      <div>建物: <span id="tiles">-</span></div>
      <div>場所: <span id="places"></span></div>
      <div>画質: <span id="quality"></span> <small>重いときは下げる</small></div>
      <div>解像度: <span id="scale"></span> <small>（自動: 重いと下げる）</small></div>
      <div><button id="full">全画面にする</button> <button id="newtab">別タブで開く</button> <small>（Esc で戻る。パネルは右上のボタンで隠せる）</small></div>
      <div><button id="bench">性能の内訳を測る（止まる・動く 約1分）</button> <small>見たい場所で押して、触らず待つ</small></div>
      <div>建物の作り: <span id="lod"></span></div>
      <div>読み込む範囲: <span id="radius"></span></div>
      <div>カメラ: <button id="auto">自動で周回</button><button id="free">自分で動かす</button><button id="street">地上目線(1.6m)</button>
        <small>（自分で: 画面をドラッグで向き、W A S D で移動、Q/E で上下、Shift で速く）</small></div>
      <div>地面の高さ(m, 楕円体高): <b id="gh"></b>
        <button data-g="-5">-5</button><button data-g="-1">-1</button><button data-g="1">+1</button><button data-g="5">+5</button>
        <small>建物が沈む/浮くなら調整</small></div>
      <div id="log"></div>
      <div style="margin-top:6px;font-size:11px;opacity:.7">出典: 3D都市モデル Project PLATEAU（国土交通省）／道路: 国土地理院ベクトルタイル／質感の素材: Poly Haven（CC0）</div>
    </div>
    <button id="hide">パネル</button>
    <button id="fwd">前へ</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
